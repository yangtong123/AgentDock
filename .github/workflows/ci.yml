name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 20
    strategy:
      matrix:
        # ubuntu: full suite. macos: also exercises the Seatbelt sandbox
        # integration tests that are skipped elsewhere.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The default permission profile is fail-closed: on Linux the layer-2
      # write jail needs bubblewrap or the agent argv tests cannot run. Ubuntu
      # restricts unprivileged user namespaces via AppArmor, which is exactly
      # what bwrap needs — enable them, then smoke-test real namespace creation.
      # needrestart can block apt interactively; keep it fully non-interactive.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y bubblewrap
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
          timeout 30 bwrap --ro-bind / / -- /bin/true

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Workbench: build + unit tests on both OSes.
      - run: npm --prefix workbench ci
      - run: npm run build:workbench
      - run: npm --prefix workbench test

  workbench-e2e:
    # Playwright end-to-end runs on Ubuntu only; macOS keeps the sandbox-focused
    # root suite.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: npm --prefix workbench ci
      - run: npm run build:workbench

      - run: npx playwright install --with-deps chromium
        working-directory: workbench

      - run: npx playwright test
        working-directory: workbench
