name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # ubuntu: full suite. macos: also exercises the Seatbelt sandbox
        # integration tests that are skipped elsewhere.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The default permission profile is fail-closed: on Linux the layer-2
      # write jail needs bubblewrap or the agent argv tests cannot run. Ubuntu
      # restricts unprivileged user namespaces via AppArmor, which is exactly
      # what bwrap needs — enable them, then smoke-test real namespace creation.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / -- /bin/true

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
